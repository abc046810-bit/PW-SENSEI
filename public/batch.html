<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch Details - PW SENSEI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <div class="sidebar-logo-text site-name-text">PW SENSEI</div>
      </div>

      <nav class="sidebar-nav">
        <a href="/study.html" class="nav-link">
          <span class="nav-icon">📖</span>
          <span>Study</span>
        </a>
        <a href="/study.html" class="nav-link active">
          <span class="nav-icon">🖥️</span>
          <span>Batches</span>
        </a>
        <a href="/mybatches.html" class="nav-link">
          <span class="nav-icon">🎓</span>
          <span>My Batches</span>
        </a>
        <a href="https://t.me/pwsensei_official" class="nav-link telegram-link-btn" target="_blank" rel="noopener noreferrer">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:inline-block; vertical-align:middle;"><circle cx="12" cy="12" r="12" fill="#24A1DE"/><path d="M5.4 11.972l11.455-4.664c.531-.192 1.002.13.829.896l-1.95 9.186c-.144.646-.531.802-1.077.502l-2.986-2.203-1.44 1.388c-.16.16-.293.293-.6.293l.214-3.045 5.54-5.008c.241-.214-.053-.332-.373-.12l-6.848 4.312-2.95-.923c-.642-.2-.656-.642.134-.951z" fill="#FFFFFF"/></svg>
          <span>Join Telegram</span>
        </a>
        <button class="nav-link" onclick="showToast('Thank you for your generosity! Batch donation channel opening soon.', 'success')" style="width:100%; text-align:left;">
          <span class="nav-icon">❤️</span>
          <span>Donate Batch</span>
        </button>
        <button class="nav-link" onclick="showToast('Test series will be available in the upcoming mock exam cycle.', 'success')" style="width:100%; text-align:left;">
          <span class="nav-icon">📝</span>
          <span>Test Series</span>
        </button>
        <a href="https://t.me/pwsensei_official" class="nav-link contact-telegram-link" target="_blank" rel="noopener noreferrer">
          <span class="nav-icon">💬</span>
          <span>Contact Us</span>
        </a>
      </nav>

      <div style="padding: 16px; border-top: 1px solid var(--card-border);">
        <a href="/admin/login.html" style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-weight: 600;">
          <span>⚙️</span>
          <span>Admin Portal</span>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <a href="/study.html" class="back-btn">
            <span>&larr;</span>
            <span>Back to Batches</span>
          </a>
        </div>

        <div class="header-right" id="header-user-area">
          <a href="https://t.me/pwsensei_official" target="_blank" rel="noopener noreferrer" class="telegram-link-btn" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(56, 189, 248, 0.12); color: #0284C7; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px; font-size: 13px; font-weight: 700;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#24A1DE"/><path d="M5.4 11.972l11.455-4.664c.531-.192 1.002.13.829.896l-1.95 9.186c-.144.646-.531.802-1.077.502l-2.986-2.203-1.44 1.388c-.16.16-.293.293-.6.293l.214-3.045 5.54-5.008c.241-.214-.053-.332-.373-.12l-6.848 4.312-2.95-.923c-.642-.2-.656-.642.134-.951z" fill="#FFFFFF"/></svg>
            <span>Telegram</span>
          </a>
          <button class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Theme">🌙</button>
        </div>
      </header>

      <!-- CONTENT BODY -->
      <main class="content-container" id="batch-main-content">
        <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
          Loading batch syllabus and classes...
        </div>
      </main>

    </div>
  </div>

  <!-- ANNOUNCEMENTS MODAL -->
  <div id="announcement-modal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">📢 Batch Announcements</h3>
        <button class="theme-toggle-btn" onclick="closeModal('announcement-modal')">&times;</button>
      </div>
      <div class="modal-body" id="announcements-modal-body">
        <p style="color: var(--text-muted);">No new announcements.</p>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    let batchData = null;
    let todayLectures = [];
    let upcomingLectures = [];
    const urlParams = new URLSearchParams(window.location.search);
    const batchId = urlParams.get('id') || 1;

    async function loadBatchDetails() {
      const container = document.getElementById('batch-main-content');
      try {
        const [batchRes, todayRes, upcomingRes] = await Promise.all([
          fetch(`/api/batches/${batchId}`),
          fetch(`/api/today-lectures?batch_id=${batchId}`),
          fetch(`/api/upcoming-lectures?batch_id=${batchId}`)
        ]);

        if (!batchRes.ok) {
          container.innerHTML = `
            <div style="text-align: center; padding: 60px 0;">
              <h2>Batch Not Found</h2>
              <p style="color: var(--text-muted); margin: 12px 0 24px 0;">The batch you requested does not exist or has been removed.</p>
              <a href="/study.html" class="btn-enroll" style="display: inline-block; padding: 12px 24px;">Explore All Batches</a>
            </div>
          `;
          return;
        }

        const data = await batchRes.json();
        batchData = data.batch;

        if (todayRes.ok) {
          const todayData = await todayRes.json();
          todayLectures = todayData.lectures || [];
        }

        if (upcomingRes.ok) {
          const upcomingData = await upcomingRes.json();
          upcomingLectures = upcomingData.lectures || [];
        }

        renderBatchDetails(batchData);
      } catch (err) {
        console.error('Error fetching batch details:', err);
        container.innerHTML = '<div style="text-align: center; color: #EF4444; padding: 60px 0;">Failed to load batch. Please try again.</div>';
      }
    }

    function renderBatchDetails(b) {
      document.title = `${b.title} - PW SENSEI`;

      const announcementCount = b.announcements ? b.announcements.length : 0;
      
      // Populate announcements modal body
      const annModalBody = document.getElementById('announcements-modal-body');
      if (b.announcements && b.announcements.length > 0) {
        annModalBody.innerHTML = b.announcements.map(a => `
          <div style="padding: 14px; background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); margin-bottom: 12px;">
            <div style="font-weight: 600; color: var(--text); margin-bottom: 4px;">${a.message}</div>
            <div style="font-size: 12px; color: var(--text-muted);">${new Date(a.created_at).toLocaleString()}</div>
          </div>
        `).join('');
      } else {
        annModalBody.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No notices or announcements posted yet.</p>';
      }

      const container = document.getElementById('batch-main-content');
      container.innerHTML = `
        <!-- HERO BANNER -->
        <div class="batch-hero">
          <div class="hero-shapes">
            <div class="hero-shape-1"></div>
            <div class="hero-shape-2"></div>
          </div>
          <div class="batch-hero-title">${b.title}</div>
          <div class="batch-hero-meta">
            <span class="batch-hero-pill">🎯 ${b.target_audience || 'All Students'}</span>
            <span class="batch-hero-pill">🗣️ ${b.language || 'Hinglish'}</span>
            <span class="batch-hero-pill">📅 Target: ${b.end_date || '2025'}</span>
            <span class="batch-hero-pill" style="background: rgba(34, 197, 94, 0.3); border-color: rgba(34, 197, 94, 0.5);">
              ${b.is_free ? '✨ 100% Free' : `₹${b.price}`}
            </span>
          </div>
        </div>

        <!-- TABS NAV -->
        <div class="tabs-nav">
          <button class="tab-btn" onclick="switchBatchTab('desc', this)">
            <span>📝</span>
            <span>Description</span>
          </button>
          <button class="tab-btn active" onclick="switchBatchTab('classes', this)">
            <span>📺</span>
            <span>All Classes</span>
          </button>
          <button class="tab-btn" onclick="switchBatchTab('tests', this)">
            <span>📋</span>
            <span>Tests</span>
          </button>
          <button class="tab-btn" onclick="switchBatchTab('infinity', this)">
            <span>♾️</span>
            <span>Infinity Learning</span>
          </button>
        </div>

        <!-- TAB CONTENT: ALL CLASSES (Default) -->
        <div id="tab-classes-content">
          
          <!-- ACTION BUTTONS -->
          <div class="action-buttons-row">
            <button class="btn-secondary-outline" onclick="shareBatch()">
              <span>🔗</span>
              <span>Share Batch</span>
            </button>
            <button class="btn-secondary-outline" onclick="openModal('announcement-modal')">
              <span>📢</span>
              <span>Announcement (${announcementCount})</span>
            </button>
            <button class="btn-secondary-outline" onclick="window.location.href='https://t.me/pwsensei_official'">
              <span>💬</span>
              <span>Telegram Doubt Group</span>
            </button>
          </div>

          <!-- TODAY'S CLASS / LIVE LECTURES -->
          <div style="margin-bottom: 28px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <h2 style="font-size: 20px; font-weight: 800; color: var(--text);">Today's Classes & Live Lectures</h2>
                ${todayLectures.some(l => l.is_live) ? '<span class="badge-live-pulse" style="background:#EF4444; color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:9999px; display:inline-flex; align-items:center; gap:4px;"><span class="live-dot" style="width:6px; height:6px; background:#fff; border-radius:50%; display:inline-block;"></span> LIVE NOW</span>' : ''}
              </div>
              <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">${todayLectures.length} Scheduled</span>
            </div>

            <div class="class-scroll-row">
              ${
                todayLectures.length > 0
                  ? todayLectures.map(v => `
                    <div class="class-card" onclick="window.location.href='/chapter.html?id=${v.chapter_id}&subject_id=${v.subject_id}&batch_id=${b.id}'">
                      <div class="class-card-thumb" style="background-image: url('${v.thumbnail_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=600'}')">
                        <div class="teacher-name-overlay">${v.teacher_name || v.subject_name || 'Kota Faculty'}</div>
                      </div>
                      <div class="class-card-content">
                        <div class="class-status-row">
                          ${
                            v.is_live
                              ? `<span class="badge-live-pulse" style="background:#EF4444; color:#fff; font-size:10px; font-weight:800; padding:2px 6px; border-radius:9999px; display:inline-flex; align-items:center; gap:4px;"><span class="live-dot" style="width:5px; height:5px; background:#fff; border-radius:50%; display:inline-block;"></span> LIVE</span>`
                              : `<span class="badge-upcoming" style="background: rgba(124, 58, 237, 0.12); color: #7C3AED;">📅 ${v.lecture_date || 'TODAY'}</span>`
                          }
                          <span class="class-time">${v.duration || '50 mins'}</span>
                        </div>
                        <div class="class-title" title="${v.title}">${v.title}</div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; justify-content: space-between;">
                          <span>${v.subject_name || ''}</span>
                          <span>Ch: ${v.chapter_title || ''}</span>
                        </div>
                      </div>
                    </div>
                  `).join('')
                  : '<div style="color: var(--text-muted); padding: 16px 0; font-size: 14px;">No classes scheduled for today in this batch. Check Upcoming Classes below or browse the syllabus chapters.</div>'
              }
            </div>
          </div>

          <!-- UPCOMING / SCHEDULED CLASSES -->
          ${
            upcomingLectures.length > 0 ? `
            <div style="margin-bottom: 28px;">
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <h2 style="font-size: 20px; font-weight: 800; color: var(--text);">⏳ Upcoming Classes</h2>
                  <span style="background: #E0F2FE; color: #0369A1; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 9999px;">SCHEDULED</span>
                </div>
                <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">${upcomingLectures.length} Future Classes</span>
              </div>

              <div class="class-scroll-row">
                ${upcomingLectures.map(v => `
                  <div class="class-card" onclick="window.location.href='/chapter.html?id=${v.chapter_id}&subject_id=${v.subject_id}&batch_id=${b.id}'">
                    <div class="class-card-thumb" style="background-image: url('${v.thumbnail_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=600'}')">
                      <div class="teacher-name-overlay">${v.teacher_name || v.subject_name || 'Kota Faculty'}</div>
                    </div>
                    <div class="class-card-content">
                      <div class="class-status-row">
                        <span class="badge-upcoming" style="background: #E0F2FE; color: #0369A1; font-weight: 700;">📅 ${v.lecture_date}</span>
                        <span class="class-time">${v.duration || '50 mins'}</span>
                      </div>
                      <div class="class-title" title="${v.title}">${v.title}</div>
                      <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; justify-content: space-between;">
                        <span>${v.subject_name || ''}</span>
                        <span>Ch: ${v.chapter_title || ''}</span>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            ` : ''
          }

          <!-- SUBJECTS LIST (2-COLUMN GRID) -->
          <div style="margin-bottom: 32px;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
              <h2 style="font-size: 20px; font-weight: 800; color: var(--text);">Syllabus & Subjects</h2>
              <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">${b.subjects ? b.subjects.length : 0} Subjects Available</span>
            </div>
            
            <div class="subjects-grid">
              ${
                b.subjects && b.subjects.length > 0
                  ? b.subjects.map(s => renderSubjectCard(s, b.id)).join('')
                  : '<div style="color: var(--text-muted); grid-column: 1/-1;">No subjects added to this batch yet.</div>'
              }
            </div>
          </div>

        </div>

        <!-- TAB CONTENT: DESCRIPTION -->
        <div id="tab-desc-content" style="display: none; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 32px; margin-bottom: 40px;">
          <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 16px;">About ${b.title}</h2>
          <p style="color: var(--text-muted); line-height: 1.7; margin-bottom: 16px;">
            This batch is comprehensively curated for ${b.target_audience || 'All Aspirants'} preparing for competitive examinations. Delivered by master educators in ${b.language || 'Hinglish'}, it covers fundamentals to advanced problem-solving, daily practice worksheets (DPPs), chapter summary notes, and regular revision milestones.
          </p>
          <ul style="padding-left: 20px; color: var(--text-muted); line-height: 1.8;">
            <li>High-definition recorded and live video streaming.</li>
            <li>Downloadable chapter summary notes and Daily Practice Problems (DPPs).</li>
            <li>Telegram community access for doubt clarification.</li>
            <li>Target Completion: ${b.end_date || 'Academic Year End'}.</li>
          </ul>
        </div>

        <!-- TAB CONTENT: TESTS -->
        <div id="tab-tests-content" style="display: none; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 40px; text-align: center; margin-bottom: 40px;">
          <div style="font-size: 48px; margin-bottom: 12px;">📝</div>
          <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Scheduled Mock Tests</h2>
          <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 20px auto;">
            Full Syllabus Mock Tests and Chapter-wise Quizzes will unlock according to the official examination planner.
          </p>
          <button class="promo-btn" onclick="showToast('Mock test calendar notified to your registered email!', 'success')">
            Notify Me When Live
          </button>
        </div>

        <!-- TAB CONTENT: INFINITY LEARNING -->
        <div id="tab-infinity-content" style="display: none; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 40px; text-align: center; margin-bottom: 40px;">
          <div style="font-size: 48px; margin-bottom: 12px;">♾️</div>
          <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Infinity AI Revision Assistant</h2>
          <p style="color: var(--text-muted); max-width: 540px; margin: 0 auto 20px auto;">
            Smart spaced repetition, formula flashcards, and conceptual quick quizzes to reinforce your retention before exam day.
          </p>
          <button class="promo-btn" onclick="showToast('Infinity Learning AI module initializing in your dashboard!', 'success')">
            Launch AI Revision
          </button>
        </div>

      `;
    }

    function renderSubjectCard(s, batchId) {
      const chapterCount = s.chapter_count || 0;
      return `
        <a href="/subject.html?batch_id=${batchId}&subject_id=${s.id}" class="subject-nav-card" id="subject-card-${s.id}">
          <div class="subject-card-left">
            <div class="subject-icon-box">${s.icon || '📚'}</div>
            <div class="subject-details">
              <div class="subject-name">${s.name}</div>
              <div class="subject-meta-tags">
                <span class="subject-chapter-badge">📂 ${chapterCount} Chapters</span>
                <span class="subject-type-badge">Structured Syllabus</span>
              </div>
            </div>
          </div>
          <div class="subject-action-btn">
            <span>Explore</span>
            <span class="subject-arrow">&rarr;</span>
          </div>
        </a>
      `;
    }

    function switchBatchTab(tabKey, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('tab-classes-content').style.display = tabKey === 'classes' ? 'block' : 'none';
      document.getElementById('tab-desc-content').style.display = tabKey === 'desc' ? 'block' : 'none';
      document.getElementById('tab-tests-content').style.display = tabKey === 'tests' ? 'block' : 'none';
      document.getElementById('tab-infinity-content').style.display = tabKey === 'infinity' ? 'block' : 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadBatchDetails();
    });
  </script>
</body>
</html>
