<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Batches - PW SENSEI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <div class="sidebar-logo-text site-name-text">PW SENSEI</div>
      </div>

      <nav class="sidebar-nav">
        <a href="/study.html" class="nav-link">
          <span class="nav-icon">📖</span>
          <span>Study</span>
        </a>
        <a href="/study.html" class="nav-link">
          <span class="nav-icon">🖥️</span>
          <span>Batches</span>
        </a>
        <a href="/mybatches.html" class="nav-link active">
          <span class="nav-icon">🎓</span>
          <span>My Batches</span>
        </a>
        <a href="https://t.me/pwsensei_official" class="nav-link telegram-link-btn" target="_blank" rel="noopener noreferrer">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:inline-block; vertical-align:middle;"><circle cx="12" cy="12" r="12" fill="#24A1DE"/><path d="M5.4 11.972l11.455-4.664c.531-.192 1.002.13.829.896l-1.95 9.186c-.144.646-.531.802-1.077.502l-2.986-2.203-1.44 1.388c-.16.16-.293.293-.6.293l.214-3.045 5.54-5.008c.241-.214-.053-.332-.373-.12l-6.848 4.312-2.95-.923c-.642-.2-.656-.642.134-.951z" fill="#FFFFFF"/></svg>
          <span>Join Telegram</span>
        </a>
        <button class="nav-link" onclick="showToast('Thank you for your generosity! Batch donation channel opening soon.', 'success')" style="width:100%; text-align:left;">
          <span class="nav-icon">❤️</span>
          <span>Donate Batch</span>
        </button>
        <button class="nav-link" onclick="showToast('Test series will be available in the upcoming mock exam cycle.', 'success')" style="width:100%; text-align:left;">
          <span class="nav-icon">📝</span>
          <span>Test Series</span>
        </button>
        <a href="https://t.me/pwsensei_official" class="nav-link contact-telegram-link" target="_blank" rel="noopener noreferrer">
          <span class="nav-icon">💬</span>
          <span>Contact Us</span>
        </a>
      </nav>

      <div style="padding: 16px; border-top: 1px solid var(--card-border);">
        <a href="/admin/login.html" style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-weight: 600;">
          <span>⚙️</span>
          <span>Admin Portal</span>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <a href="/study.html" class="back-btn">
            <span>&larr;</span>
            <span>All Batches</span>
          </a>
        </div>

        <div class="header-right" id="header-user-area">
          <a href="https://t.me/pwsensei_official" target="_blank" rel="noopener noreferrer" class="telegram-link-btn" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(56, 189, 248, 0.12); color: #0284C7; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px; font-size: 13px; font-weight: 700;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#24A1DE"/><path d="M5.4 11.972l11.455-4.664c.531-.192 1.002.13.829.896l-1.95 9.186c-.144.646-.531.802-1.077.502l-2.986-2.203-1.44 1.388c-.16.16-.293.293-.6.293l.214-3.045 5.54-5.008c.241-.214-.053-.332-.373-.12l-6.848 4.312-2.95-.923c-.642-.2-.656-.642.134-.951z" fill="#FFFFFF"/></svg>
            <span>Telegram</span>
          </a>
          <button class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Theme">🌙</button>
        </div>
      </header>

      <!-- CONTENT BODY -->
      <main class="content-container">
        
        <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;">
          <div>
            <h1 style="font-size: 32px; font-weight: 800; color: var(--text);">My Saved Batches</h1>
            <p style="color: var(--text-muted); font-size: 15px; margin-top: 4px;">Direct, unrestricted access to all your study batches.</p>
          </div>
          <a href="/study.html" class="btn-enroll" style="padding: 10px 20px; font-size: 14px;">
            + Explore All Batches
          </a>
        </div>

        <!-- MY BATCHES GRID -->
        <div id="my-batches-grid" class="batch-grid">
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: var(--text-muted);">
            Loading your batches...
          </div>
        </div>

      </main>

    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    async function loadMyBatches() {
      const grid = document.getElementById('my-batches-grid');
      try {
        const res = await fetch('/api/batches');
        const data = await res.json();
        const allBatches = data.batches || [];
        const savedIds = JSON.parse(localStorage.getItem('pwsensei_saved_batches') || '[]');

        // If user saved some batches, show those. If none saved yet, show all available batches ready to study!
        let displayedBatches = allBatches.filter(b => savedIds.includes(b.id));

        if (displayedBatches.length === 0) {
          if (allBatches.length === 0) {
            grid.innerHTML = `
              <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px;">
                <div style="font-size: 48px; margin-bottom: 12px;">📚</div>
                <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">No Batches Available Yet</h2>
                <p style="color: var(--text-muted); margin-bottom: 24px;">New classes will be uploaded soon by the educators.</p>
              </div>
            `;
            return;
          }

          // If no specific batch is bookmarked yet, show all open batches directly
          grid.innerHTML = `
            <div style="grid-column: 1/-1; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; text-align: center;">
              <div style="font-size: 32px; margin-bottom: 8px;">🚀</div>
              <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 6px;">All Batches Are Open & 100% Free</h3>
              <p style="color: var(--text-muted); font-size: 14px;">Select any batch below to start learning immediately or click "Save ⭐" to pin it to your quick list.</p>
            </div>
            ${allBatches.map(b => renderBatchItem(b, false)).join('')}
          `;
          return;
        }

        grid.innerHTML = displayedBatches.map(b => renderBatchItem(b, true)).join('');
      } catch (err) {
        console.error('Error fetching batches:', err);
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #EF4444; padding: 40px;">Failed to load batches.</div>';
      }
    }

    function renderBatchItem(b, isSaved) {
      return `
        <div class="batch-card" id="batch-card-${b.id}">
          <div class="batch-thumbnail" style="background-image: url('${b.thumbnail_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=600'}')">
            <div class="batch-badge-row">
              <span class="batch-new-badge" style="background: #22C55E; color: white;">ACTIVE</span>
            </div>
            <div class="batch-thumb-title">${b.title}</div>
          </div>
          
          <div class="batch-card-body">
            <div class="batch-tags-row">
              <span class="batch-tag-lang">${b.language || 'Hinglish'}</span>
              <span class="batch-tag-target">${b.target_audience || 'All Aspirants'}</span>
            </div>

            <div class="batch-dates">
              <span>📅</span>
              <span>${b.start_date || 'Ongoing'} - ${b.end_date || 'Exam Day'}</span>
            </div>

            <div class="batch-actions-row" style="margin-top: auto;">
              <a href="/batch.html?id=${b.id}" class="btn-study">
                Start Studying &rarr;
              </a>
              <button class="${isSaved ? 'btn-unenroll' : 'btn-enroll'}" id="enroll-btn-${b.id}" onclick="${isSaved ? `unenrollFromBatch(event, ${b.id})` : `enrollInBatch(event, ${b.id})`}">
                ${isSaved ? 'Saved ⭐' : 'Save Batch'}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadMyBatches();
    });
  </script>
</body>
</html>
