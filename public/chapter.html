<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Content - PW SENSEI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-layout">
    
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">🎓</div>
        <div class="sidebar-logo-text site-name-text">PW SENSEI</div>
      </div>

      <nav class="sidebar-nav">
        <a href="/study.html" class="nav-link">
          <span class="nav-icon">📖</span>
          <span>Study</span>
        </a>
        <a href="/study.html" class="nav-link active">
          <span class="nav-icon">🖥️</span>
          <span>Batches</span>
        </a>
        <a href="/mybatches.html" class="nav-link">
          <span class="nav-icon">🎓</span>
          <span>My Batches</span>
        </a>
        <a href="https://t.me/pwsensei_official" class="nav-link telegram-link-btn" target="_blank" rel="noopener noreferrer">
          <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" style="display:inline-block; vertical-align:middle;"><circle cx="12" cy="12" r="12" fill="#24A1DE"/><path d="M5.4 11.972l11.455-4.664c.531-.192 1.002.13.829.896l-1.95 9.186c-.144.646-.531.802-1.077.502l-2.986-2.203-1.44 1.388c-.16.16-.293.293-.6.293l.214-3.045 5.54-5.008c.241-.214-.053-.332-.373-.12l-6.848 4.312-2.95-.923c-.642-.2-.656-.642.134-.951z" fill="#FFFFFF"/></svg>
          <span>Join Telegram</span>
        </a>
        <button class="nav-link" onclick="showToast('Thank you for your generosity! Batch donation channel opening soon.', 'success')" style="width:100%; text-align:left;">
          <span class="nav-icon">❤️</span>
          <span>Donate Batch</span>
        </button>
        <button class="nav-link" onclick="showToast('Test series will be available in the upcoming mock exam cycle.', 'success')" style="width:100%; text-align:left;">
          <span class="nav-icon">📝</span>
          <span>Test Series</span>
        </button>
        <a href="https://t.me/pwsensei_official" class="nav-link contact-telegram-link" target="_blank" rel="noopener noreferrer">
          <span class="nav-icon">💬</span>
          <span>Contact Us</span>
        </a>
      </nav>

      <div style="padding: 16px; border-top: 1px solid var(--card-border);">
        <a href="/admin/login.html" style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-weight: 600;">
          <span>⚙️</span>
          <span>Admin Portal</span>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="main-wrapper">
      
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <a href="#" id="back-to-subject-btn" class="back-btn">
            <span>&larr;</span>
            <span id="back-subject-text">Back to Subject</span>
          </a>
        </div>

        <div class="header-right" id="header-user-area">
          <a href="https://t.me/pwsensei_official" target="_blank" rel="noopener noreferrer" class="telegram-link-btn" style="display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(56, 189, 248, 0.12); color: #0284C7; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 9999px; font-size: 13px; font-weight: 700;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#24A1DE"/><path d="M5.4 11.972l11.455-4.664c.531-.192 1.002.13.829.896l-1.95 9.186c-.144.646-.531.802-1.077.502l-2.986-2.203-1.44 1.388c-.16.16-.293.293-.6.293l.214-3.045 5.54-5.008c.241-.214-.053-.332-.373-.12l-6.848 4.312-2.95-.923c-.642-.2-.656-.642.134-.951z" fill="#FFFFFF"/></svg>
            <span>Telegram</span>
          </a>
          <button class="theme-toggle-btn" onclick="toggleDarkMode()" title="Toggle Theme">🌙</button>
        </div>
      </header>

      <!-- CONTENT CONTAINER -->
      <main class="content-container" id="chapter-main-content">
        <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
          Loading chapter content and lectures...
        </div>
      </main>

    </div>
  </div>

  <!-- VIDEO PLAYER MODAL -->
  <div id="video-player-modal" class="modal-backdrop">
    <div class="modal-card video-modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="video-modal-title">📹 Lecture Player</h3>
        <button class="theme-toggle-btn" onclick="closeVideoModal()">&times;</button>
      </div>
      <div class="modal-body" style="padding: 0;">
        <div class="video-iframe-wrap" id="video-iframe-container">
          <!-- Embed or player injected dynamically -->
        </div>
        <div style="padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-top: 1px solid var(--card-border);">
          <span id="video-modal-teacher" style="font-size: 13px; font-weight: 600; color: var(--text-muted);"></span>
          <a id="video-modal-ext-link" href="#" target="_blank" class="btn-secondary-outline" style="font-size: 12px; padding: 6px 12px;">
            <span>Open in Full Tab ↗️</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- INTERACTIVE DPP QUIZ MODAL -->
  <div id="quiz-runner-modal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 680px;">
      <div class="modal-header">
        <div>
          <span style="font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase;">DPP Online Practice</span>
          <h3 class="modal-title" id="quiz-modal-title">DPP Quiz</h3>
        </div>
        <button class="theme-toggle-btn" onclick="closeModal('quiz-runner-modal')">&times;</button>
      </div>
      <div class="modal-body" id="quiz-modal-body">
        <!-- Quiz content loaded dynamically -->
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const chapterId = urlParams.get('chapter_id') || urlParams.get('id') || 1;
    const subjectId = urlParams.get('subject_id') || '';
    const batchId = urlParams.get('batch_id') || '';

    let chapterData = null;
    let activeTab = 'lectures';

    async function loadChapterDetails() {
      const container = document.getElementById('chapter-main-content');
      try {
        const res = await fetch(`/api/chapters/${chapterId}`);
        if (!res.ok) {
          container.innerHTML = `
            <div class="empty-state-box">
              <div class="empty-state-icon">🔍</div>
              <h2 class="empty-state-title">Chapter Not Found</h2>
              <p class="empty-state-desc">The chapter you requested is currently unavailable or has been removed.</p>
              <a href="/study.html" class="btn-enroll" style="display: inline-block; padding: 12px 24px;">Explore Batches</a>
            </div>
          `;
          return;
        }

        const data = await res.json();
        chapterData = data;
        renderChapterPage(data);
      } catch (err) {
        console.error('Error fetching chapter content:', err);
        container.innerHTML = '<div style="text-align: center; color: #EF4444; padding: 60px 0;">Failed to load chapter content. Please try again.</div>';
      }
    }

    function renderChapterPage(data) {
      const { chapter, subject, batch, sibling_chapters, content, counts } = data;
      document.title = `${chapter.title} - ${subject ? subject.name : 'Study'} | PW SENSEI`;

      const sId = subject ? subject.id : (subjectId || 1);
      const bId = batch ? batch.id : (batchId || 1);

      // Set back button destination
      const backBtn = document.getElementById('back-to-subject-btn');
      backBtn.href = `/subject.html?batch_id=${bId}&subject_id=${sId}`;
      document.getElementById('back-subject-text').textContent = `Back to ${subject ? subject.name : 'Subject'}`;

      const container = document.getElementById('chapter-main-content');

      const chNum = chapter.chapter_number || 1;
      const formattedNum = chNum < 10 ? `0${chNum}` : `${chNum}`;

      container.innerHTML = `
        <!-- BREADCRUMB -->
        <nav class="content-breadcrumb">
          <a href="/study.html">Batches</a>
          <span class="breadcrumb-sep">&gt;</span>
          <a href="/batch.html?id=${bId}">${batch ? batch.title : 'Batch'}</a>
          <span class="breadcrumb-sep">&gt;</span>
          <a href="/subject.html?batch_id=${bId}&subject_id=${sId}">${subject ? subject.name : 'Subject'}</a>
          <span class="breadcrumb-sep">&gt;</span>
          <span class="breadcrumb-current">Chapter ${formattedNum}</span>
        </nav>

        <!-- CHAPTER HEADER BANNER -->
        <div class="chapter-header-card">
          <div class="chapter-header-top">
            <div class="chapter-badge-wrap">
              <span class="chapter-badge-accent">CHAPTER ${formattedNum}</span>
              <span class="chapter-subject-pill">${subject ? subject.icon : '📚'} ${subject ? subject.name : 'Subject'}</span>
            </div>
            
            ${
              sibling_chapters && sibling_chapters.length > 1
                ? `
                  <div class="chapter-switcher-wrap">
                    <label for="chapter-select" class="chapter-switcher-label">Switch Chapter:</label>
                    <select id="chapter-select" class="chapter-switcher-select" onchange="switchChapter(this.value, ${sId}, ${bId})">
                      ${sibling_chapters.map(c => `
                        <option value="${c.id}" ${c.id == chapter.id ? 'selected' : ''}>
                          Ch ${c.chapter_number || 1}: ${c.title}
                        </option>
                      `).join('')}
                    </select>
                  </div>
                `
                : ''
            }
          </div>

          <h1 class="chapter-page-title">${chapter.title}</h1>
          
          ${
            chapter.description 
              ? `<p class="chapter-page-desc">${chapter.description}</p>` 
              : ''
          }
        </div>

        <!-- THE 5 EXACT CONTENT CATEGORY TABS -->
        <div class="chapter-tabs-nav" id="chapter-tabs-bar">
          <button class="chapter-tab-btn ${activeTab === 'lectures' ? 'active' : ''}" onclick="selectChapterTab('lectures', this)">
            <span class="tab-icon">📹</span>
            <span class="tab-title">Lectures</span>
            <span class="tab-count ${counts.lectures > 0 ? 'highlight' : ''}">${counts.lectures}</span>
          </button>
          <button class="chapter-tab-btn ${activeTab === 'notes' ? 'active' : ''}" onclick="selectChapterTab('notes', this)">
            <span class="tab-icon">📑</span>
            <span class="tab-title">Notes</span>
            <span class="tab-count ${counts.notes > 0 ? 'highlight' : ''}">${counts.notes}</span>
          </button>
          <button class="chapter-tab-btn ${activeTab === 'dpp_quiz' ? 'active' : ''}" onclick="selectChapterTab('dpp_quiz', this)">
            <span class="tab-icon">📝</span>
            <span class="tab-title">DPP Quiz</span>
            <span class="tab-count ${counts.dpp_quizzes > 0 ? 'highlight' : ''}">${counts.dpp_quizzes}</span>
          </button>
          <button class="chapter-tab-btn ${activeTab === 'dpp_pdf' ? 'active' : ''}" onclick="selectChapterTab('dpp_pdf', this)">
            <span class="tab-icon">📄</span>
            <span class="tab-title">DPP PDF</span>
            <span class="tab-count ${counts.dpp_pdfs > 0 ? 'highlight' : ''}">${counts.dpp_pdfs}</span>
          </button>
          <button class="chapter-tab-btn ${activeTab === 'dpp_video' ? 'active' : ''}" onclick="selectChapterTab('dpp_video', this)">
            <span class="tab-icon">🎥</span>
            <span class="tab-title">DPP Video</span>
            <span class="tab-count ${counts.dpp_videos > 0 ? 'highlight' : ''}">${counts.dpp_videos}</span>
          </button>
        </div>

        <!-- TAB CONTENT VIEW AREA -->
        <div class="chapter-tab-content" id="chapter-tab-content-area">
          ${renderActiveTabContent()}
        </div>
      `;
    }

    function selectChapterTab(tabName, btn) {
      activeTab = tabName;
      document.querySelectorAll('.chapter-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      
      const contentArea = document.getElementById('chapter-tab-content-area');
      if (contentArea) {
        contentArea.innerHTML = renderActiveTabContent();
      }
    }

    function renderActiveTabContent() {
      if (!chapterData) return '';
      const { content, chapter } = chapterData;

      switch (activeTab) {
        case 'lectures':
          return renderLecturesTab(content.lectures, chapter);
        case 'notes':
          return renderNotesTab(content.notes, chapter);
        case 'dpp_quiz':
          return renderDppQuizTab(content.dpp_quizzes, chapter);
        case 'dpp_pdf':
          return renderDppPdfTab(content.dpp_pdfs, chapter);
        case 'dpp_video':
          return renderDppVideoTab(content.dpp_videos, chapter);
        default:
          return renderLecturesTab(content.lectures, chapter);
      }
    }

    // 1. LECTURES TAB
    function renderLecturesTab(lectures, chapter) {
      if (!lectures || lectures.length === 0) {
        return renderComingSoonComponent(
          '📹 Lectures Coming Soon',
          `Video lectures for "${chapter.title}" are currently being scheduled and produced by our master educators. Check back shortly or join our Telegram channel for live stream alerts.`
        );
      }

      return `
        <div class="content-items-grid">
          ${lectures.map((lec, idx) => {
            const hasNotes = lec.notes && lec.notes.external_link;
            const hasDppPdf = lec.dpp_pdf && lec.dpp_pdf.external_link;
            const hasDppVid = lec.dpp_video && lec.dpp_video.external_link;
            const hasQuiz = lec.dpp_quiz;
            const extraRes = Array.isArray(lec.extra_resources) ? lec.extra_resources : [];
            const lecNumberDisplay = (lec.lecture_number !== undefined && lec.lecture_number !== null && String(lec.lecture_number).trim() !== '') 
              ? lec.lecture_number 
              : ((lec.display_order !== undefined && lec.display_order !== null && String(lec.display_order).trim() !== '') 
                ? lec.display_order 
                : (idx + 1));

            return `
            <div class="lecture-content-card" id="lecture-item-${lec.id}">
              <div class="lecture-thumb-box" onclick="openVideoPlayer('${lec.external_link}', '${lec.title.replace(/'/g, "\\'")}', '${(lec.teacher_name || '').replace(/'/g, "\\'")}')">
                <img src="${lec.thumbnail_url || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&q=80&w=600'}" alt="${lec.title}" class="lecture-thumb-img" loading="lazy" />
                <div class="lecture-play-overlay">
                  <div class="play-circle-btn">▶</div>
                </div>
                ${
                  lec.is_live
                    ? '<div style="position: absolute; top: 8px; left: 8px; z-index: 2;"><span class="badge-live-pulse" style="background:#EF4444; color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:9999px; display:inline-flex; align-items:center; gap:4px; box-shadow:0 2px 8px rgba(239,68,68,0.5);"><span class="live-dot" style="width:6px; height:6px; background:#fff; border-radius:50%; display:inline-block;"></span> LIVE</span></div>'
                    : ''
                }
                <div class="lecture-duration-tag">${lec.duration || '45 mins'}</div>
              </div>

              <div class="lecture-card-body">
                <div class="lecture-meta-top" style="flex-wrap: wrap; gap: 6px;">
                  <span class="badge-lecture-type">LECTURE ${lecNumberDisplay}</span>
                  ${
                    lec.is_live
                      ? '<span class="badge-live-pulse" style="background:#EF4444; color:#fff; font-size:11px; font-weight:800; padding:2px 8px; border-radius:9999px; display:inline-flex; align-items:center; gap:4px;"><span class="live-dot" style="width:5px; height:5px; background:#fff; border-radius:50%; display:inline-block;"></span> LIVE NOW</span>'
                      : (function() {
                          let todayStr = '';
                          try { todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date()); } catch(e) { todayStr = new Date().toISOString().split('T')[0]; }
                          if (lec.lecture_date === todayStr || lec.is_today) {
                            return '<span class="badge-lecture-status" style="background: rgba(124, 58, 237, 0.15); color: #7C3AED; font-weight: 700;">⭐ TODAY</span>';
                          } else if (lec.lecture_date && lec.lecture_date > todayStr) {
                            return '<span class="badge-lecture-status" style="background: #E0F2FE; color: #0369A1; font-weight: 700;">⏳ UPCOMING</span>';
                          }
                          return '';
                        })()
                  }
                  ${lec.lecture_date ? `<span class="badge-lecture-status" style="background: rgba(124, 58, 237, 0.08); color: var(--primary);">📅 ${lec.lecture_date}</span>` : '<span class="badge-lecture-status">HD RECORDED</span>'}
                </div>
                <h3 class="lecture-card-title">${lec.title}</h3>
                <div class="lecture-teacher-row">
                  <span class="teacher-avatar">👨‍🏫</span>
                  <span class="teacher-name">${lec.teacher_name || 'Kota Master Faculty'}</span>
                </div>

                <div class="lecture-card-actions">
                  <button class="btn-watch-lecture" onclick="openVideoPlayer('${lec.external_link}', '${lec.title.replace(/'/g, "\\'")}', '${(lec.teacher_name || '').replace(/'/g, "\\'")}')">
                    <span>▶️ Watch Lecture</span>
                  </button>
                  <a href="${lec.external_link}" target="_blank" class="btn-link-external" title="Open external video link">
                    <span>↗</span>
                  </a>
                </div>

                <div style="margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-border); display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
                  ${hasNotes ? `<a href="${lec.notes.external_link}" target="_blank" class="btn-secondary-outline" style="font-size: 11px; padding: 4px 8px;">📑 Class Notes</a>` : `<span style="font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px dashed var(--card-border); padding: 3px 8px; border-radius: 4px; font-weight: 600;">NO NOTES</span>`}
                  ${hasDppPdf ? `<a href="${lec.dpp_pdf.external_link}" target="_blank" class="btn-secondary-outline" style="font-size: 11px; padding: 4px 8px;">📄 DPP PDF</a>` : `<span style="font-size: 11px; color: var(--text-muted); background: var(--bg); border: 1px dashed var(--card-border); padding: 3px 8px; border-radius: 4px; font-weight: 600;">NO DPP</span>`}
                  ${hasDppVid ? `<button type="button" onclick="openVideoPlayer('${lec.dpp_video.external_link}', '${(lec.dpp_video.title || '').replace(/'/g, "\\'")}', '${(lec.dpp_video.teacher_name || '').replace(/'/g, "\\'")}')" class="btn-secondary-outline" style="font-size: 11px; padding: 4px 8px;">📹 DPP Solution</button>` : ''}
                  ${hasQuiz ? `<button type="button" onclick="startDppQuiz(${lec.dpp_quiz.id})" class="btn-secondary-outline" style="font-size: 11px; padding: 4px 8px;">⚡ Practice Quiz</button>` : ''}
                  ${extraRes.map(er => `<a href="${er.url}" target="_blank" class="btn-secondary-outline" style="font-size: 11px; padding: 4px 8px;">🔗 ${er.title}</a>`).join('')}
                </div>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
    }

    // 2. NOTES TAB
    function renderNotesTab(notes, chapter) {
      if (!notes || notes.length === 0) {
        return renderComingSoonComponent(
          '📑 Notes Coming Soon',
          `Comprehensive handwritten master class notes and formula summary handbooks for "${chapter.title}" are being compiled. Downloadable PDFs will be available here soon.`
        );
      }

      return `
        <div class="content-items-grid">
          ${notes.map((note, idx) => {
            const noteLabel = (note.display_order !== undefined && note.display_order !== null && String(note.display_order).trim() !== '') ? note.display_order : (idx + 1);
            return `
            <div class="note-content-card" id="note-item-${note.id}">
              <div class="note-icon-badge">📄</div>
              <div class="note-body">
                <div class="note-type-pill">STUDY NOTES &bull; PART ${noteLabel}</div>
                <h3 class="note-card-title">${note.title}</h3>
                <div class="note-meta-info">
                  <span>📦 File Size: ${note.file_size || '2.4 MB'}</span>
                  <span>&bull;</span>
                  <span>High Quality PDF</span>
                </div>
              </div>
              <div class="note-actions">
                <a href="${note.external_link}" target="_blank" class="btn-view-pdf">
                  <span>👁️ View PDF</span>
                </a>
                <a href="${note.external_link}" download target="_blank" class="btn-download-pdf" title="Download to device">
                  <span>⬇️ Download</span>
                </a>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
    }

    // 3. DPP QUIZ TAB
    function renderDppQuizTab(quizzes, chapter) {
      if (!quizzes || quizzes.length === 0) {
        return renderComingSoonComponent(
          '📝 DPP Quizzes Coming Soon',
          `Interactive Daily Practice Problem (DPP) Quizzes for "${chapter.title}" are being formulated. Practice tests with timed questions and instant analysis will launch shortly.`
        );
      }

      return `
        <div class="content-items-grid">
          ${quizzes.map((quiz, idx) => {
            const quizLabel = (quiz.display_order !== undefined && quiz.display_order !== null && String(quiz.display_order).trim() !== '') ? quiz.display_order : (idx + 1);
            return `
            <div class="quiz-content-card" id="quiz-item-${quiz.id}">
              <div class="quiz-card-top">
                <div class="quiz-number-badge">QUIZ ${quizLabel}</div>
                <span class="quiz-status-pill">⏱️ ${quiz.duration_mins || 15} Mins</span>
              </div>

              <h3 class="quiz-card-title">${quiz.title}</h3>
              <p class="quiz-card-desc">Practice high-yield questions selected to test core concepts and problem-solving speed for ${chapter.title}.</p>

              <div class="quiz-stats-row">
                <div class="quiz-stat-box">
                  <span class="quiz-stat-num">${quiz.total_questions || 10}</span>
                  <span class="quiz-stat-text">Questions</span>
                </div>
                <div class="quiz-stat-box">
                  <span class="quiz-stat-num">${quiz.duration_mins || 15} min</span>
                  <span class="quiz-stat-text">Time Limit</span>
                </div>
                <div class="quiz-stat-box">
                  <span class="quiz-stat-num">+4 / -1</span>
                  <span class="quiz-stat-text">Marking Scheme</span>
                </div>
              </div>

              <div class="quiz-card-actions">
                <button class="btn-start-quiz" onclick="startDppQuiz(${quiz.id})">
                  <span>⚡ Start Online Quiz</span>
                </button>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
    }

    // 4. DPP PDF TAB
    function renderDppPdfTab(dppPdfs, chapter) {
      if (!dppPdfs || dppPdfs.length === 0) {
        return renderComingSoonComponent(
          '📄 DPP PDFs Coming Soon',
          `Daily Practice Problem worksheets and question sheets with answer keys for "${chapter.title}" are being curated. Printable PDF problem sets will be uploaded soon.`
        );
      }

      return `
        <div class="content-items-grid">
          ${dppPdfs.map((pdf, idx) => {
            const dppLabel = (pdf.display_order !== undefined && pdf.display_order !== null && String(pdf.display_order).trim() !== '') ? pdf.display_order : (idx + 1);
            return `
            <div class="dpp-pdf-card" id="dpp-pdf-item-${pdf.id}">
              <div class="dpp-pdf-badge-icon">📑</div>
              <div class="dpp-pdf-body">
                <div class="dpp-pdf-pill">DAILY PRACTICE PROBLEM &bull; DPP ${dppLabel}</div>
                <h3 class="dpp-pdf-title">${pdf.title}</h3>
                <div class="dpp-pdf-meta">
                  <span>📄 Includes Answer Key & Hints</span>
                  <span>&bull;</span>
                  <span>${pdf.file_size || '1.5 MB'}</span>
                </div>
              </div>
              <div class="dpp-pdf-actions">
                <a href="${pdf.external_link}" target="_blank" class="btn-view-pdf">
                  <span>👁️ View Sheet</span>
                </a>
                <a href="${pdf.external_link}" download target="_blank" class="btn-download-pdf" title="Download PDF Sheet">
                  <span>⬇️ Download</span>
                </a>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
    }

    // 5. DPP VIDEO TAB
    function renderDppVideoTab(dppVideos, chapter) {
      if (!dppVideos || dppVideos.length === 0) {
        return renderComingSoonComponent(
          '🎥 DPP Video Solutions Coming Soon',
          `Step-by-step video solution discussions for each DPP question in "${chapter.title}" are currently being recorded. Comprehensive video solutions will be live shortly.`
        );
      }

      return `
        <div class="content-items-grid">
          ${dppVideos.map((dppVid, idx) => {
            const dppVidLabel = (dppVid.display_order !== undefined && dppVid.display_order !== null && String(dppVid.display_order).trim() !== '') ? dppVid.display_order : (idx + 1);
            return `
            <div class="lecture-content-card" id="dpp-vid-item-${dppVid.id}">
              <div class="lecture-thumb-box" onclick="openVideoPlayer('${dppVid.external_link}', '${dppVid.title.replace(/'/g, "\\'")}', '${(dppVid.teacher_name || '').replace(/'/g, "\\'")}')">
                <img src="${dppVid.thumbnail_url || 'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&q=80&w=600'}" alt="${dppVid.title}" class="lecture-thumb-img" loading="lazy" />
                <div class="lecture-play-overlay">
                  <div class="play-circle-btn" style="background: #2563EB;">▶</div>
                </div>
                <div class="lecture-duration-tag">${dppVid.duration || '35 mins'}</div>
              </div>

              <div class="lecture-card-body">
                <div class="lecture-meta-top">
                  <span class="badge-lecture-type" style="background: rgba(37, 99, 235, 0.15); color: #2563EB;">DPP SOLUTION ${dppVidLabel}</span>
                  <span class="badge-lecture-status">STEP-BY-STEP</span>
                </div>
                <h3 class="lecture-card-title">${dppVid.title}</h3>
                <div class="lecture-teacher-row">
                  <span class="teacher-avatar">👨‍🏫</span>
                  <span class="teacher-name">${dppVid.teacher_name || 'Kota Master Faculty'}</span>
                </div>
                <div class="lecture-card-actions">
                  <button class="btn-watch-lecture" style="background: #2563EB;" onclick="openVideoPlayer('${dppVid.external_link}', '${dppVid.title.replace(/'/g, "\\'")}', '${(dppVid.teacher_name || '').replace(/'/g, "\\'")}')">
                    <span>🎥 Watch Solution</span>
                  </button>
                  <a href="${dppVid.external_link}" target="_blank" class="btn-link-external" title="Open external video link">
                    <span>↗</span>
                  </a>
                </div>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `;
    }

    // GENERIC COMING SOON COMPONENT
    function renderComingSoonComponent(title, description) {
      return `
        <div class="coming-soon-card">
          <div class="coming-soon-icon-wrap">
            <div class="coming-soon-pulse"></div>
            <span class="coming-soon-icon">⏳</span>
          </div>
          <div class="coming-soon-badge">SECTION COMING SOON</div>
          <h2 class="coming-soon-title">${title}</h2>
          <p class="coming-soon-desc">${description}</p>
          <div class="coming-soon-actions">
            <a href="https://t.me/pwsensei_official" target="_blank" class="coming-soon-btn primary">
              <span>✈️</span>
              <span>Join Telegram for Release Alerts</span>
            </a>
            <button class="coming-soon-btn secondary" onclick="notifyMeToast()">
              <span>🔔</span>
              <span>Notify Me When Live</span>
            </button>
            <button class="coming-soon-btn text" onclick="selectChapterTab('lectures', document.querySelector('.chapter-tab-btn'))">
              <span>← Check Other Tabs</span>
            </button>
          </div>
        </div>
      `;
    }

    // Video Player Modal
    function openVideoPlayer(link, title, teacher) {
      const modal = document.getElementById('video-player-modal');
      const titleEl = document.getElementById('video-modal-title');
      const teacherEl = document.getElementById('video-modal-teacher');
      const extLinkEl = document.getElementById('video-modal-ext-link');
      const container = document.getElementById('video-iframe-container');

      titleEl.textContent = title || 'Lecture Video';
      teacherEl.textContent = teacher ? `Educator: ${teacher}` : '';
      extLinkEl.href = link || '#';

      // Parse video link (YouTube or direct)
      let videoEmbedUrl = link;
      if (link.includes('youtube.com/watch?v=')) {
        const vidId = link.split('v=')[1]?.split('&')[0];
        videoEmbedUrl = `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0`;
      } else if (link.includes('youtu.be/')) {
        const vidId = link.split('youtu.be/')[1]?.split('?')[0];
        videoEmbedUrl = `https://www.youtube.com/embed/${vidId}?autoplay=1&rel=0`;
      }

      container.innerHTML = `
        <iframe 
          src="${videoEmbedUrl}" 
          title="${title}" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen 
          class="video-iframe">
        </iframe>
      `;

      modal.classList.add('active');
    }

    function closeVideoModal() {
      const modal = document.getElementById('video-player-modal');
      const container = document.getElementById('video-iframe-container');
      container.innerHTML = '';
      modal.classList.remove('active');
    }

    // DPP Quiz Runner
    function startDppQuiz(quizId) {
      if (!chapterData) return;
      const quiz = chapterData.content.dpp_quizzes.find(q => q.id === quizId);
      if (!quiz) return;

      const modal = document.getElementById('quiz-runner-modal');
      const titleEl = document.getElementById('quiz-modal-title');
      const bodyEl = document.getElementById('quiz-modal-body');

      titleEl.textContent = quiz.title;

      const questions = quiz.questions && quiz.questions.length > 0 ? quiz.questions : [
        {
          q: "Which fundamental dimensional formula correctly applies to the concepts discussed in this chapter?",
          options: ["[M L T^-2]", "[M L^2 T^-2]", "[M^0 L^0 T^0]", "[M L^-1 T^-2]"],
          answer: 1,
          explanation: "Option B is correct according to the fundamental definition of energy and work."
        },
        {
          q: "When a particle undergoes constant acceleration, what is the proportional ratio of displacements?",
          options: ["1 : 2", "1 : 3", "1 : 5", "1 : 4"],
          answer: 2,
          explanation: "According to Galileo's law of odd numbers, displacements in successive equal intervals are in ratio of odd integers."
        }
      ];

      bodyEl.innerHTML = `
        <div style="margin-bottom: 20px; padding: 12px; background: rgba(124, 58, 237, 0.08); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 13px; font-weight: 700; color: var(--primary);">📋 Total Questions: ${questions.length}</span>
          <span style="font-size: 13px; font-weight: 700; color: #0284C7;">⏱️ Suggested Time: ${quiz.duration_mins || 15} Mins</span>
        </div>

        <form id="dpp-quiz-form" onsubmit="submitDppQuiz(event, ${quizId})">
          ${questions.map((qObj, qIdx) => `
            <div class="quiz-question-block" style="margin-bottom: 24px; padding: 16px; background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);">
              <div style="font-weight: 700; color: var(--text); margin-bottom: 12px; font-size: 15px;">
                Q${qIdx + 1}. ${qObj.q}
              </div>
              <div class="quiz-options-list" style="display: flex; flex-direction: column; gap: 8px;">
                ${qObj.options.map((opt, optIdx) => `
                  <label class="quiz-option-label" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--card-border); border-radius: var(--radius-sm); cursor: pointer; background: var(--card-bg);">
                    <input type="radio" name="q_${qIdx}" value="${optIdx}" required />
                    <span style="font-size: 14px; color: var(--text);">${opt}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `).join('')}

          <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
            <button type="button" class="btn-secondary-outline" onclick="closeModal('quiz-runner-modal')">Cancel</button>
            <button type="submit" class="btn-enroll" style="padding: 10px 24px;">Submit Quiz & View Score</button>
          </div>
        </form>
      `;

      modal.classList.add('active');
    }

    function submitDppQuiz(event, quizId) {
      event.preventDefault();
      const quiz = chapterData.content.dpp_quizzes.find(q => q.id === quizId);
      if (!quiz) return;

      const questions = quiz.questions || [];
      const form = document.getElementById('dpp-quiz-form');
      const formData = new FormData(form);

      let correctCount = 0;
      let total = questions.length || 1;

      questions.forEach((q, idx) => {
        const selected = formData.get(`q_${idx}`);
        if (selected !== null && parseInt(selected, 10) === q.answer) {
          correctCount++;
        }
      });

      const scorePercentage = Math.round((correctCount / total) * 100);
      const marks = (correctCount * 4) - ((total - correctCount) * 1);

      const bodyEl = document.getElementById('quiz-modal-body');
      bodyEl.innerHTML = `
        <div style="text-align: center; padding: 24px 0;">
          <div style="font-size: 54px; margin-bottom: 12px;">🎉</div>
          <h2 style="font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 6px;">Quiz Completed!</h2>
          <p style="color: var(--text-muted); margin-bottom: 20px;">Great effort on practicing today's high-yield problems.</p>

          <div style="display: flex; justify-content: center; gap: 16px; margin-bottom: 24px;">
            <div style="padding: 16px 20px; background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);">
              <div style="font-size: 24px; font-weight: 900; color: #22C55E;">${correctCount} / ${total}</div>
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Correct Answers</div>
            </div>
            <div style="padding: 16px 20px; background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);">
              <div style="font-size: 24px; font-weight: 900; color: var(--primary);">${marks} Marks</div>
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Score (+4 / -1)</div>
            </div>
            <div style="padding: 16px 20px; background: var(--bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);">
              <div style="font-size: 24px; font-weight: 900; color: #0284C7;">${scorePercentage}%</div>
              <div style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Accuracy</div>
            </div>
          </div>

          <div style="display: flex; justify-content: center; gap: 12px;">
            <button class="btn-secondary-outline" onclick="startDppQuiz(${quizId})">🔄 Retake Quiz</button>
            <button class="btn-enroll" onclick="closeModal('quiz-runner-modal')">Done & Return</button>
          </div>
        </div>
      `;
    }

    function switchChapter(newChapId, sId, bId) {
      window.location.href = `/chapter.html?chapter_id=${newChapId}&subject_id=${sId}&batch_id=${bId}`;
    }

    function notifyMeToast() {
      showToast('Notification alert enabled! You will be notified as soon as new materials are uploaded.', 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadChapterDetails();
    });
  </script>
</body>
</html>
