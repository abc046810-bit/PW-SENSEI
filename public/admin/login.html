<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - PW SENSEI</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body style="background: #0F172A; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div class="admin-login-box">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="font-size: 36px; margin-bottom: 8px;">🛡️</div>
      <h1 style="font-size: 24px; font-weight: 800; font-family: 'Poppins', sans-serif; color: #111827;">Admin Control Center</h1>
      <p style="color: #6B7280; font-size: 14px; margin-top: 4px;">Sign in to manage batches, subjects, videos & settings</p>
    </div>

    <form onsubmit="handleAdminLogin(event)">
      <div id="login-error" style="display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 8px; background: #FEE2E2; border: 1px solid #FCA5A5; color: #991B1B; font-size: 13.5px; font-weight: 600; line-height: 1.4;"></div>

      <div class="form-group">
        <label class="form-label" for="admin-username">Admin Username / Identifier</label>
        <input type="text" id="admin-username" class="form-control" placeholder="Enter ADMIN_USERNAME" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="admin-password">Admin Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="Enter ADMIN_PASSWORD" autocomplete="current-password" required />
      </div>

      <button type="submit" id="login-submit-btn" class="btn-primary" style="width: 100%; justify-content: center; padding: 13px; margin-top: 8px;">
        Unlock Admin Dashboard &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px;">
      <a href="/study.html" style="font-size: 13px; color: #6B7280; font-weight: 600;">&larr; Back to Main Site</a>
    </div>
  </div>

  <script>
    // If already authenticated via token or session, redirect to admin index
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('pw_admin_token');
      if (token) {
        try {
          const res = await fetch('/api/admin/me', {
            headers: {
              'Authorization': `Bearer ${token}`,
              'x-admin-token': token
            },
            credentials: 'include'
          });
          if (res.ok) {
            window.location.href = '/SK08';
          }
        } catch (e) {}
      }
    });

    async function handleAdminLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      const submitBtn = document.getElementById('login-submit-btn');
      errBox.style.display = 'none';

      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;

      if (!username || !password) {
        errBox.textContent = 'Please enter both username and password.';
        errBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          if (data.token) {
            localStorage.setItem('pw_admin_token', data.token);
          }
          window.location.href = '/SK08';
        } else {
          errBox.textContent = data.error || 'Invalid admin credentials.';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Unlock Admin Dashboard →';
        }
      } catch (err) {
        errBox.textContent = 'Failed to connect to authentication server.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock Admin Dashboard →';
      }
    }
  </script>
</body>
</html>
